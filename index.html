<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countries Map</title>
    <link rel="icon" href="./images/world-icon.svg">
    <link rel="stylesheet" href="./css/main.css">
    <style type="text/tailwindcss">
        @theme {
            --color-clifford: #da373d;
        }
        
    </style>
</head>
<body class="bg-(--dark-bg)">
    <header class="shadow-lg sm:mb-[73px] mb-[33px] bg-(--dark-header)">
        <div class="container">
            <div class="header flex items-centeri justify-between py-3 min-[380px]:py-4 sm:py-5 sm:gap-0 gap-2">
                <div class="header__title-wrapper flex items-center gap-[10px]  sm:gap-[14px]">
                    <img class="min-[380px]:w-[45px] min-[380px]:h-[45px] w-[35px] h-[35px] sm:w-[55px] sm:h-[55px]" src="./images/world-icon.svg" alt="world-icon" width="55" height="55">
                    <a class="  px-3 min-[380px]:px- 6 sm:px-8  py-1 min-[380px]:py-2 sm:py-3 bg-white text-sky-700 font-semibold  text-lg min-[380px]:text-xl sm:text-2xl rounded-full shadow-md hover:shadow-lg hover:scale-105 duration-300" href="/">Country</a>
                </div>
                <div class="flex items-center sm:gap-[10px] gap-2">
                    <button onclick="handleLikeCountBtn()" class=" w-[40px] h-[40px] min-[380px]:w-[48px] min-[380px]:h-[48px]  sm:w-[55px] sm:h-[55px] rounded-[50%] border border-slate-300 flex items-center justify-around cursor-pointer bg-(--dark-icons) ">
                        <img class="w-[18px] h-[18px] min-[380px]:w-[22px] min-[380px]:h-[22px] sm:w-[25px] sm:h-[25px] hover:scale-125 duration-300" src="./images/like-icon.svg" alt="like-icon" width="25" height="25">
                        <span class="like-count font-semibold  text-[10px] min-[380px]:text-[12px] sm:text-[13px]">(0)</span>
                    </button>
                    <button onclick="handleSavedCountBtn()" class="w-[40px] h-[40px] min-[380px]:w-[48px] min-[380px]:h-[48px]  sm:w-[55px] sm:h-[55px] rounded-[50%] border border-slate-300 flex items-center justify-around cursor-pointer bg-(--dark-icons) ">
                        <img class="w-[18px] h-[18px] min-[380px]:w-[22px] min-[380px]:h-[22px] sm:w-[25px] sm:h-[25px] h-[18px] hover:scale-125 duration-300" src="./images/saved-icon.svg" alt="saved-icon" width="25" height="25">
                        <span class="saved-count font-semibold sm:text-[13px] text-[10px]">(0)</span>
                    </button>
                    <button class="w-[40px] h-[40px] min-[380px]:w-[48px] min-[380px]:h-[48px]  sm:w-[55px] sm:h-[55px] rounded-[50%] border border-slate-300 flex items-center justify-around cursor-pointer bg-(--dark-icons) ">
                        <img id="moon" class="w-[18px] h-[18px] min-[380px]:w-[22px] min-[380px]:h-[22px] sm:w-[25px] sm:h-[25px] h-[18px] hover:scale-125 duration-300 " src="./images/dark-icon.svg" alt="dark-icon" width="25" height="25">
                        <img id="sun" class="w-[18px] h-[18px] min-[380px]:w-[22px] min-[380px]:h-[22px] sm:w-[25px] sm:h-[25px] h-[18px] hover:scale-125 duration-300 hidden" src="./images/sun-icon.svg" alt="sun-icon" width="25" height="25">
                    </button>
                </div>
            </div>
        </div>
    </header>
    
    <main class="site-main">
        <section class="hero-section mb-[30px]">
            <div class="container">
                <div class=" sm:p-3 min-[380px]:p-2 p-1 flex items-center justify-between mb-[50px]">
                    <input class="input-search sm:w-[330px] min-[380px]:w-[180px] w-[150px] rounded-[10px] border-[2px] border-slate-400 outline-slate-500 p-2 px-3 bg-(--dark-input) text-(--dark-input--text) placeholder:text-(--dark-input--text) focus:outline-none" type="search" name="user_search" placeholder="Search countries..." autocomplete="off">
                    <select class="select-change cursor-pointer sm:w-[230px] w-[100px] rounded-[10px] border-[2px] border-slate-400 outline-slate-500 p-2 px-3 focus:outline-none bg-(--dark-input) text-(--dark-input--text)" name="All" id="">
                        <option value="All">All</option>
                    </select>
                </div>
                
                <ul class="hero__list"></ul>
            </div>
        </section>
    </main>
    
    <div id="wrapper" class="modal-wrapper fixed inset-0 backdrop-blur duration-300 scale-0 flex items-center justify-center px-2">
        <div class="modal-inner w-full max-w-[600px] sm:h-[450px] h-[410px] relative bg-slate-500 rounded-lg shadow-lg">
            <button onclick="handleCloseBtn()" class="close-btn absolute sm:right-[5px] right-[8px] sm:top-[5px] top-[8px] hover:scale-125 duration-300 cursor-pointer">
                <img class="sm:w-[55px] sm:h-[55px] w-[40px] h-[40px]" src="./images/close-icon.svg" alt="close-icon" width="55" height="55">
            </button>
            <div class="modal-content"></div>
        </div>
    </div>
    
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="./js/main.js"></script>
</body>
</html>
